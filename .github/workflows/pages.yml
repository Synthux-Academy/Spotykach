name: Sample manager (GitHub Pages)

# Manual deploy: Actions → "Sample manager (GitHub Pages)" → Run workflow.
# Publishes web/ from the given branch, tag or commit, so the page can be
# deployed while the code stays on a feature branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy web/ from
        required: true
        default: uploader

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # web/usb-transfer is a symlink to the submodule's js/: put the real files there
      # (refs from before the submodule don't have it)
      - run: |
          if [ -L web/usb-transfer ]; then
            git submodule update --init lib/usb-transfer
            rm web/usb-transfer
            cp -R lib/usb-transfer/js web/usb-transfer
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
