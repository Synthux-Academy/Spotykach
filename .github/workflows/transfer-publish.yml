name: Publish @synthuxacademy/spotykach-transfer

# Push a tag spotykach-transfer-v<version> matching web/spotykach-transfer/package.json.
# Publishes through npm trusted publishing (OIDC), no token: on npmjs.com the package's
# settings name Synthux-Academy/Spotykach and this workflow file as its trusted publisher.
on:
  push:
    tags:
      - spotykach-transfer-v*

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/transfer-tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/spotykach-transfer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "spotykach-transfer-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later, Node 22 ships 10.x
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
